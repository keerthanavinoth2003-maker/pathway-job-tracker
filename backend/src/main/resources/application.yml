server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pathway_db}
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-this-to-a-long-random-secret-123456}
    expiration-ms: 86400000
